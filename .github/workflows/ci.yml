name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit and HTTP regressions (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  postgres:
    name: PostgreSQL rollback and concurrency regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse_test
          POSTGRES_PASSWORD: warehouse_test
          POSTGRES_DB: warehouse_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse_test -d warehouse_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://warehouse_test:warehouse_test@127.0.0.1:5432/warehouse_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  ppt:
    name: Offline deck regression evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run ppt:eval -- --no-render
      - name: Save deck evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppt-evaluation
          path: tools/ppt-preview/out/eval/
          retention-days: 7
          if-no-files-found: warn
